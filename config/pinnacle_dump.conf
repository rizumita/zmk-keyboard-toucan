# Pinnacle register dump (debug only)
#
# Usage ideas:
# - Temporarily merge these into your shield .conf, OR
# - Build with an extra config file (preferred) so normal firmware stays quiet.
#
# This enables:
# - DEBUG logs for input drivers (`CONFIG_INPUT_LOG_LEVEL=4`)
# - Pinnacle register snapshot dumps on button transitions
#   (`CONFIG_INPUT_PINNACLE_DEBUG_DUMP=y`)

CONFIG_LOG=y
CONFIG_INPUT_LOG_LEVEL=4
CONFIG_INPUT_PINNACLE_DEBUG_DUMP=y

# Pick ONE log transport you already use (examples):
# - RTT (SWD + J-Link): enable Zephyr RTT log backend in your build config.
# - USB CDC/UART: enable a UART/USB console + log backend in your build config.

