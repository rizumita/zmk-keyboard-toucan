# Toucan (right / peripheral) debug: USB serial logging for Pinnacle dumps
#
# Goal: see LOG_HEXDUMP_DBG output without SWD/RTT.
# How to use: build/flash the right half, then connect it via USB and open the
# CDC ACM serial port (e.g. /dev/cu.usbmodem* on macOS).

CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_INPUT_LOG_LEVEL_DBG=y

# Enable Pinnacle register snapshot dumps (0x00..0x17) on button transitions.
CONFIG_INPUT_PINNACLE_DEBUG_DUMP=y

# Route Zephyr console/logging over USB CDC ACM.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

